name: Bug report
description: Report incorrect behavior, a crash, or a meshing/numerical discrepancy
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security** issues, do not file here — see
        [SECURITY.md](https://github.com/CyberdyneCorp/CyberMeshGenerator/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: tetrahedralize() rejects a watertight STL that TetGen meshes, or produces inverted tets...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal case — the input model/PLC (or a snippet that builds one), the MeshOptions / switch string, the backend, and how you drove it (C++, CLI, Python, Swift, or `just`).
      placeholder: |
        cmg -pq1.414a0.1 bunny.stl
        # or a code snippet / Python script; attach the smallest failing input file
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend
      placeholder: CPU (default) / CUDA / OpenCL / Metal
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler + version, CMake version, GPU + driver (if relevant), commit/tag.
      placeholder: |
        Ubuntu 24.04, GCC 13.3, CMake 3.28, RTX 5060 (driver 580.95), commit abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant build or run output (paste as text or attach files).
      render: shell

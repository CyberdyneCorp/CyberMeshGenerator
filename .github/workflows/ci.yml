name: CI

on: [push, pull_request]

jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict

  build-cpu:
    # The portable CPU-only baseline: zero extra deps, warnings-as-errors, tests.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
             -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
             -DCMG_WARNINGS_AS_ERRORS=ON -DCMG_BUILD_C_ABI=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMG_ENABLE_ASAN=ON -DCMG_BUILD_C_ABI=ON
      - run: cmake --build build-asan -j
      - run: ctest --test-dir build-asan --output-on-failure

  build-mobile:
    # Single-precision baseline stands in for the iOS/Android CPU-only contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-mobile -DCMAKE_BUILD_TYPE=Release -DCMG_SINGLE=ON
      - run: cmake --build build-mobile -j
      - run: ctest --test-dir build-mobile --output-on-failure

  python-bindings:
    # Build the shared C ABI and run the Python (ctypes/NumPy) binding test.
    # (The CUDA backend is validated locally on a GPU; standard runners have none.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy
      - run: cmake -S . -B build-py -DCMG_BUILD_C_ABI=ON -DCMG_BUILD_SHARED=ON -DCMG_BUILD_TESTS=OFF -DCMG_BUILD_CLI=OFF
      - run: cmake --build build-py -j
      - run: CMG_C_LIB=$(find build-py -name 'libcmg_c.so' | head -1) python bindings/python/tests/test_cybermesh.py
